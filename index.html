<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="./style.css">

</head>
<body>
    <div class="app-wrapper">
        <h1 id="app-title">My To-Do App</h1>

        <form class="todo-container" id="todo-box" onsubmit="todoInput(event);">
            <div class="search-icon-wrapper" id="search-trigger" onclick="activateTodoApp()">
                <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="search-icon">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.603 10.603Z" />
                </svg>
            </div>

            <input type="text" id="todo-input" placeholder="Write a task here..." autocomplete="off" disabled>
            <button type="submit" id="add-btn">+</button>
        </form>

        <ul id="todo-show"></ul>  
    </div>
    <script src="script.js"></script>
</body>
</html>
